[config.site]
title = "Ren Yuxiang"
description = "Ren Yuxiang 的个人网站，记录项目、文章与持续学习。"
pageTitle = "Ren Yuxiang | 个人网站"
pageDescription = "记录项目、文章与持续学习的个人空间。"
url = "https://renyufly.github.io"
repository = "https://github.com/renyufly/renyufly.github.io"
footerNote = "基于 Astro 与 Navfolio 构建。"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索文章与项目..."
maxResults = 6

[config.pages.blog]
title = "文章"
kicker = "写作归档"
subtitle = "技术、项目与思考。"
note = "这里收录值得长期保存的文章和学习记录。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "浏览文章"
subtitle = ""
note = "按主题浏览文章。"

[config.pages.blog.series]
title = "系列"
kicker = "阅读路径"
subtitle = ""
note = "按顺序阅读相互关联的内容。"

[config.pages.projects]
title = "项目"
kicker = "作品与实践"
subtitle = "持续构建，持续记录。"
note = "这里展示个人项目、实现过程和相关文档。"

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Ren Yuxiang"
handle = "@renyufly"
role = "Developer"
email = "renyufly@users.noreply.github.com"
website = "https://renyufly.github.io/"
github = "https://github.com/renyufly"
avatar = "/images/logo-thin.webp"

[[config.topNav.links]]
label = "首页"
href = "/"

[[config.topNav.links]]
label = "文章"
href = "/blog"

[[config.topNav.links]]
label = "项目"
